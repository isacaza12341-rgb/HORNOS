<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Buscador de Hornos</title>

<meta name="description" content="Buscador de bundle tags por secuencia de horno">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  :root{
    --bg:#F2F1EC;
    --panel:#FFFFFF;
    --ink:#22252A;
    --ink-soft:#5B6068;
    --line:#E1DFD6;
    --header:#20242B;
    --header-ink:#F2F1EC;
    --accent:#3B6E8F;
    --accent-ink:#FFFFFF;
    --pass:#3F8F5F;
    --pass-bg:#E6F2EA;
    --fail:#B54A3F;
    --fail-bg:#F7E9E7;
    --pending:#B8860B;
    --pending-bg:#FBF1DA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  #htapp{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    max-width:480px;
    margin:0 auto;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .ht-header{
    background:var(--header);
    color:var(--header-ink);
    padding:16px 18px 14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .ht-header-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .ht-title{font-size:19px;font-weight:700;letter-spacing:0.2px;}
  .ht-sub{font-size:12px;color:#A9AEB6;margin-top:2px;}
  .ht-badge{
    background:#333944;
    color:#E7DCC4;
    border-radius:20px;
    padding:4px 11px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }
  .ht-content{flex:1;padding:14px 14px 90px;overflow-y:auto;}
  .ht-tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .ht-tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:9px 4px 8px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:11px;
    font-weight:600;
    font-family:inherit;
  }
  .ht-tab.active{color:var(--accent);}
  .ht-tab svg{width:20px;height:20px;}

  .ht-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:10px;
  }
  .ht-label{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .ht-search-row{display:flex;gap:8px;}
  .ht-input, .ht-select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
    background:#FCFCFA;
    color:var(--ink);
  }
  .ht-input:focus, .ht-select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .ht-btn{
    padding:11px 16px;
    border-radius:8px;
    border:none;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
  }
  .ht-btn-primary{background:var(--accent);color:var(--accent-ink);}
  .ht-btn-primary:active{opacity:0.85;}
  .ht-btn-primary:disabled{opacity:0.5;}
  .ht-btn-block{width:100%;padding:13px;font-size:16px;margin-top:6px;}
  .ht-btn-ghost{background:#EDECE5;color:var(--ink);}

  .ht-stats{display:flex;gap:8px;margin:2px 0 12px;}
  .ht-stat{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 8px;
    text-align:center;
  }
  .ht-stat-num{font-size:19px;font-weight:800;line-height:1.1;}
  .ht-stat-lbl{font-size:10.5px;color:var(--ink-soft);margin-top:2px;font-weight:600;}

  .ht-press-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .ht-press-chip{
    background:#E9EEF1;
    color:var(--accent);
    border-radius:20px;
    padding:5px 11px;
    font-size:12px;
    font-weight:700;
  }

  .ht-tag-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    margin-bottom:8px;
  }
  .ht-tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ht-tag-id{font-size:15px;font-weight:700;}
  .ht-tag-item{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .ht-hl-row{display:flex;gap:8px;margin-top:10px;}
  .ht-tag-collapsed{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .ht-tag-collapsed .ht-hl-box{flex:1;}
  .ht-tag-expanded{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .ht-hl-box{flex:1;background:#EAF1F5;border:1.5px solid var(--accent);border-radius:8px;padding:7px 10px;text-align:center;}
  .ht-hl-label{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.3px;}
  .ht-hl-value{font-size:20px;font-weight:800;color:var(--ink);line-height:1.2;margin-top:1px;}

  .ht-tag-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px 10px;
    margin-top:9px;
    font-size:12.5px;
  }
  .ht-tag-grid div span{display:block;color:var(--ink-soft);font-size:10.5px;font-weight:600;}
  .ht-status-btn{
    border:none;
    border-radius:20px;
    padding:5px 12px;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
  }
  .ht-status-pending{background:var(--pending-bg);color:var(--pending);}
  .ht-status-pass{background:var(--pass-bg);color:var(--pass);}
  .ht-status-fail{background:var(--fail-bg);color:var(--fail);}

  .ht-empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .ht-empty svg{width:38px;height:38px;margin-bottom:10px;opacity:0.5;}

  .ht-seq-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .ht-seq-head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;}
  .ht-seq-left{display:flex;align-items:center;gap:10px;}
  .ht-seq-num{font-size:17px;font-weight:800;}
  .ht-seq-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .ht-chevron{transition:transform 0.15s;color:var(--ink-soft);}
  .ht-seq-body{padding:0 14px 14px;border-top:1px solid var(--line);}
  .ht-seq-stats{display:flex;gap:8px;padding:0 14px 13px;}
  .ht-seq-stat{flex:1;border-radius:8px;padding:8px 6px;text-align:center;}
  .ht-seq-stat.pend{background:var(--pending-bg);}
  .ht-seq-stat.rel{background:var(--pass-bg);}
  .ht-seq-stat-num{font-size:18px;font-weight:800;line-height:1.1;}
  .ht-seq-stat.pend .ht-seq-stat-num{color:var(--pending);}
  .ht-seq-stat.rel .ht-seq-stat-num{color:var(--pass);}
  .ht-seq-stat-lbl{font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:1px;}
  .ht-seq-stat-sub{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}


  .ht-toast{
    position:fixed;
    left:50%;
    bottom:86px;
    transform:translateX(-50%);
    background:#20242B;
    color:#fff;
    padding:10px 18px;
    border-radius:24px;
    font-size:13.5px;
    font-weight:600;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s, transform 0.2s;
    max-width:90%;
    text-align:center;
  }
  .ht-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .ht-sync-box{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:20px 16px;
    text-align:center;
    background:var(--panel);
  }
  .ht-sync-box svg{width:30px;height:30px;color:var(--accent);margin-bottom:8px;}
  .ht-sync-title{font-size:14.5px;font-weight:700;margin-bottom:4px;}
  .ht-sync-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.4;}
  .ht-meta-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:8px 2px;border-top:1px solid var(--line);margin-top:4px;}
  .ht-meta-row b{color:var(--ink);}

  .ht-tara-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .ht-tara-row button{background:none;border:none;color:var(--accent);font-weight:700;font-size:12px;font-family:inherit;padding:0;}
  .ht-pes-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel);}
  .ht-pes-neto{font-size:17px;font-weight:800;}
  .ht-pes-bruto{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .ht-pes-del{background:#F7E9E7;border:none;color:var(--fail);font-size:19px;line-height:1;width:30px;height:30px;border-radius:50%;font-family:inherit;}
</style>

  <div class="ht-header">
    <div class="ht-header-row">
      <div>
        <div class="ht-title">Buscador de Hornos</div>

  </div>

  <div class="ht-toast" id="ht-toast"></div>
  <input type="file" id="ht-file-input" accept=".xlsx,.xls" style="display:none" onchange="htHandleFile(event)" />
</div>

  const RECORDS_KEY = 'bundle_tags_v1';
  const META_KEY = 'bundle_tags_meta_v1';
  const PESAJES_KEY = 'ht_pesajes_v1';
  const TARA_KEY = 'ht_tara_v1';
  const TARA_DEFAULT = 900;

  const MANAGED_HEADERS = {
    'Tag Number':'tagNumber','Item Number':'itemNumber','Press':'press','Extrusion Date':'extrusionDate',
    'Qty Prod':'qtyProd','Extrusion Shift':'extrusionShift','Bundle Weight (LB)':'bundleWeight',
    'Order Number':'orderNumber','Rack No.':'rackNo','Aging Load #':'secuencia','Pass Fail':'passFail',
    'Description Line 1':'description','Customer Name':'customerName','Branch':'branch','Alloy':'alloy','Temper':'temper'
  };

  let records = [];
  let headers = SEED.headers.slice();
  let lastImport = null;
  let lastExport = null;
  let currentTab = 'buscar';
  let searchSeq = '';
  let expandedSeq = null;
  let syncBusy = false;
  let pesajes = [];
  let tara = TARA_DEFAULT;

  async function htLoad(){
    try{
      const raw = localStorage.getItem(RECORDS_KEY);
      records = raw ? JSON.parse(raw) : SEED.records.slice();
      if(!raw){ await htSaveRecords(); }
    }catch(e){
      records = SEED.records.slice();
      try{ await htSaveRecords(); }catch(e2){}
    }
    try{
      const rawMeta = localStorage.getItem(META_KEY);
      if(rawMeta){
        const meta = JSON.parse(rawMeta);
        headers = meta.headers && meta.headers.length ? meta.headers : headers;
        lastImport = meta.lastImport || null;
        lastExport = meta.lastExport || null;
      }
    }catch(e){ /* no meta yet, keep defaults */ }
    try{
      const rawPes = localStorage.getItem(PESAJES_KEY);
      pesajes = rawPes ? JSON.parse(rawPes) : [];
    }catch(e){ pesajes = []; }
    try{
      const rawTara = localStorage.getItem(TARA_KEY);
      tara = rawTara!==null && rawTara!=='' && !isNaN(Number(rawTara)) ? Number(rawTara) : TARA_DEFAULT;
    }catch(e){ tara = TARA_DEFAULT; }
    htRender();
  }

  async function htSaveRecords(){
    try{ localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); }
    catch(e){ console.error(e); htToast('No se pudo guardar en el teléfono.'); }
  }
  async function htSaveMeta(){
    try{ localStorage.setItem(META_KEY, JSON.stringify({headers, lastImport, lastExport})); }
    catch(e){ console.error(e); }
  }
  function htSavePesajes(){
    try{ localStorage.setItem(PESAJES_KEY, JSON.stringify(pesajes)); }
    catch(e){ console.error(e); htToast('No se pudo guardar en el teléfono.'); }
  }
  function htSaveTara(){
    try{ localStorage.setItem(TARA_KEY, String(tara)); }
    catch(e){ console.error(e); }
  }

  function htToast(msg){
    const t = document.getElementById('ht-toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  window.htSwitchTab = function(tab){
    if(currentTab==='scan' && tab!=='scan'){ htCleanupScanner(); scanning=false; }
    currentTab = tab;
    document.querySelectorAll('.ht-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    htRender();
  };

  function esc(s){
    return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtNum(n, dec){
    if(n===undefined||n===null||n==='') return '—';
    const num = Number(n);
    if(isNaN(num)) return '—';
    return num.toLocaleString('es-MX', {minimumFractionDigits:dec||0, maximumFractionDigits:dec||0});
  }
  function fmtDate(d){
    if(!d) return '—';
    const parts = String(d).split('-');
    if(parts.length!==3) return d;
    return parts[2]+'/'+parts[1]+'/'+parts[0].slice(2);
  }
  function fmtDateTime(iso){
    if(!iso) return 'nunca';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return 'nunca';
    const pad = n=>String(n).padStart(2,'0');
    return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function htUpdateHeader(){
    document.getElementById('ht-total-badge').textContent = records.length + ' bundles';
    const subs = {
      buscar: 'Busca por secuencia de horno',
      scan: 'Escanea el código de barras del bundle',
      resumen: 'Secuencias con Pass/Fail pendiente',
      contador: 'Contador de libras',
      sync: 'Sincronizar con el Excel'
    };
    document.getElementById('ht-subtitle').textContent = subs[currentTab];
  }

  function htRender(){
    htUpdateHeader();
    const c = document.getElementById('ht-content');
    if(currentTab==='buscar') c.innerHTML = htRenderBuscar();
    else if(currentTab==='scan') c.innerHTML = htRenderScan();
    else if(currentTab==='resumen') c.innerHTML = htRenderResumen();
    else if(currentTab==='contador') c.innerHTML = htRenderContador();
    else c.innerHTML = htRenderSync();
  }

  // ---------- BUSCAR ----------
  function htRenderBuscar(){
    let html = '';
    html += '<div class="ht-card">';
    html += '<div class="ht-label">SECUENCIA DE HORNO</div>';
    html += '<div class="ht-search-row">';
    html += '<input class="ht-input" id="ht-search-input" type="number" inputmode="numeric" placeholder="Ej. 37209" value="'+esc(searchSeq)+'" />';
    html += '<button class="ht-btn ht-btn-primary" onclick="htDoSearch()">Buscar</button>';
    html += '</div></div>';

    if(searchSeq===''){
      html += '<div class="ht-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div>Escribe una secuencia de horno<br/>para ver sus bundle tags</div></div>';
      return html;
    }

    const matches = records.filter(r=>String(r.secuencia)===String(searchSeq));
    if(matches.length===0){
      html += '<div class="ht-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div>No hay bundles con la secuencia '+esc(searchSeq)+'</div></div>';
      return html;
    }

    const totalWeight = matches.reduce((s,r)=>s+(Number(r.bundleWeight)||0),0);
    const byPress = {};
    matches.forEach(r=>{ const p=r.press||'—'; byPress[p]=(byPress[p]||0)+(Number(r.bundleWeight)||0); });

    html += '<div class="ht-stats">';
    html += '<div class="ht-stat"><div class="ht-stat-num">'+matches.length+'</div><div class="ht-stat-lbl">BUNDLES</div></div>';
    html += '<div class="ht-stat"><div class="ht-stat-num">'+fmtNum(totalWeight,0)+'</div><div class="ht-stat-lbl">LIBRAS TOTAL</div></div>';
    html += '</div>';

    html += '<div class="ht-press-row">';
    Object.keys(byPress).forEach(p=>{
      html += '<div class="ht-press-chip">'+esc(p)+': '+fmtNum(byPress[p],0)+' lb</div>';
    });
    html += '</div>';

    matches.sort((a,b)=>String(a.rackNo).localeCompare(String(b.rackNo)));
    matches.forEach(r=>{ html += htTagCard(r); });

    return html;
  }

  window.htDoSearch = function(){
    const v = document.getElementById('ht-search-input').value.trim();
    searchSeq = v;
    htRender();
  };

  let expandedTags = {};

  function htTagCard(r){
    const statusClass = r.passFail==='P' ? 'ht-status-pass' : r.passFail==='F' ? 'ht-status-fail' : 'ht-status-pending';
    const statusLabel = r.passFail==='P' ? 'PASS' : r.passFail==='F' ? 'FAIL' : 'PENDIENTE';
    const borderColor = r.passFail==='P' ? 'var(--pass)' : r.passFail==='F' ? 'var(--fail)' : 'var(--pending)';
    const isOpen = !!expandedTags[r.id];
    let html = '<div class="ht-tag-card" style="border-left-color:'+borderColor+'">';

    html += '<div class="ht-tag-collapsed" onclick="htToggleTag(\''+r.id+'\')">';
    html += '<div class="ht-hl-box"><div class="ht-hl-label">No. de parte</div><div class="ht-hl-value">'+esc(r.itemNumber||'—')+'</div></div>';
    html += '<div class="ht-hl-box"><div class="ht-hl-label">Rack</div><div class="ht-hl-value">'+esc(r.rackNo||'—')+'</div></div>';
    html += '<div class="ht-chevron" style="transform:rotate('+(isOpen?90:0)+'deg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>';
    html += '</div>';

    if(isOpen){
      html += '<div class="ht-tag-expanded">';
      html += '<div class="ht-tag-top"><div><div class="ht-tag-id">'+esc(r.tagNumber)+'</div><div class="ht-tag-item">Tag Number</div></div>';
      html += '<span class="ht-status-btn '+statusClass+'">'+statusLabel+'</span></div>';
      html += '<div class="ht-hl-row">';
      html += '<div class="ht-hl-box"><div class="ht-hl-label">Piezas</div><div class="ht-hl-value">'+fmtNum(r.qtyProd,0)+'</div></div>';
      html += '</div>';
      html += '<div class="ht-tag-grid">';
      html += '<div><span>Prensa</span>'+esc(r.press)+'</div>';
      html += '<div><span>Peso (LB)</span>'+fmtNum(r.bundleWeight,2)+'</div>';
      html += '<div><span>Aleación</span>'+esc(r.alloy||'—')+'</div>';
      html += '<div><span>Temple</span>'+esc(r.temper||'—')+'</div>';
      html += '<div><span>Turno</span>'+esc(r.extrusionShift||'—')+'</div>';
      html += '<div><span>Fecha</span>'+fmtDate(r.extrusionDate)+'</div>';
      html += '<div><span>Orden</span>'+esc(r.orderNumber||'—')+'</div>';
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }

  window.htToggleTag = function(id){
    expandedTags[id] = !expandedTags[id];
    htRender();
  };

  // ---------- ESCANEAR ----------
  let scanning = false;
  let scanResult = null;
  let scanNotFound = null;
  let zxingReader = null;

  function htRenderScan(){
    let html = '';

    if(scanning){
      html += '<div class="ht-card" style="padding:10px">';
      html += '<video id="ht-scan-video" autoplay playsinline muted style="width:100%;border-radius:8px;background:#000;display:block;max-height:340px;object-fit:cover"></video>';
      html += '<div style="font-size:12px;color:var(--ink-soft);text-align:center;margin-top:10px">Centra el código de barras del bundle tag frente a la cámara</div>';
      html += '<button class="ht-btn ht-btn-ghost ht-btn-block" style="margin-top:10px" onclick="htStopScan()">Cancelar</button>';
      html += '</div>';
      return html;
    }

    if(scanResult){
      html += '<div class="ht-card"><div class="ht-label">CÓDIGO ESCANEADO</div><div style="font-size:17px;font-weight:800">'+esc(scanResult.tagNumber)+'</div></div>';
      expandedTags[scanResult.id] = true;
      html += htTagCard(scanResult);
      html += '<button class="ht-btn ht-btn-primary ht-btn-block" onclick="htStartScan()">Escanear otro</button>';
      return html;
    }

    if(scanNotFound){
      html += '<div class="ht-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div>No se encontró ningún bundle con el código<br/><b>'+esc(scanNotFound)+'</b></div></div>';
      html += '<button class="ht-btn ht-btn-primary ht-btn-block" onclick="htStartScan()">Escanear otro</button>';
      return html;
    }

    html += '<div class="ht-card" style="text-align:center;padding:28px 16px">';
    html += '<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="var(--accent)" stroke-width="1.7" style="margin-bottom:10px"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="8" x2="7" y2="16"/><line x1="10" y1="8" x2="10" y2="16"/><line x1="13" y1="8" x2="13" y2="16"/><line x1="16" y1="8" x2="16" y2="16"/><line x1="18" y1="8" x2="18" y2="16"/></svg>';
    html += '<div style="font-weight:700;font-size:15px;margin-bottom:6px">Escanear bundle tag</div>';
    html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.4">Apunta la cámara al código de barras del bundle tag y te muestro su información al instante.</div>';
    html += '<button class="ht-btn ht-btn-primary ht-btn-block" onclick="htStartScan()">Iniciar cámara</button>';
    html += '</div>';
    return html;
  }

  window.htStartScan = async function(){
    scanResult = null;
    scanNotFound = null;
    scanning = true;
    htRender();
    await new Promise(r=>setTimeout(r, 60)); // deja montar el <video>
    try{
      if(typeof ZXing === 'undefined'){ throw new Error('ZXing no disponible'); }
      const videoElem = document.getElementById('ht-scan-video');
      zxingReader = new ZXing.BrowserMultiFormatReader();
      await zxingReader.decodeFromVideoDevice(null, videoElem, (result, err) => {
        if(result){ htHandleScanResult(result.getText()); }
      });
    }catch(e){
      console.error(e);
      scanning = false;
      htToast('No se pudo acceder a la cámara. Revisa los permisos.');
      htRender();
    }
  };

  window.htStopScan = function(){
    htCleanupScanner();
    scanning = false;
    htRender();
  };

  function htCleanupScanner(){
    if(zxingReader){
      try{ zxingReader.reset(); }catch(e){}
      zxingReader = null;
    }
  }

  function htHandleScanResult(code){
    htCleanupScanner();
    scanning = false;
    const clean = String(code).trim();
    const rec = records.find(r=>String(r.tagNumber).trim()===clean);
    if(rec){ scanResult = rec; scanNotFound = null; }
    else{ scanResult = null; scanNotFound = clean; }
    htRender();
  }

  // ---------- RESUMEN ----------
  function htRenderResumen(){
    const seqMap = {};
    records.forEach(r=>{
      const s = r.secuencia===''||r.secuencia===undefined||r.secuencia===null ? null : String(r.secuencia);
      if(s===null) return;
      if(!seqMap[s]) seqMap[s] = [];
      seqMap[s].push(r);
    });
    const pending = Object.keys(seqMap)
      .map(s=>{
        const items = seqMap[s];
        const pendItems = items.filter(r=>!r.passFail);
        return {seq:s, items, pendItems};
      })
      .filter(x=>x.pendItems.length>0)
      .sort((a,b)=>b.pendItems.length-a.pendItems.length);

    let html = '';
    if(pending.length===0){
      html += '<div class="ht-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg><div>No hay secuencias pendientes.<br/>Todo tiene Pass/Fail capturado.</div></div>';
      return html;
    }

    pending.forEach(({seq, items, pendItems})=>{
      const totalWeight = items.reduce((s,r)=>s+(Number(r.bundleWeight)||0),0);
      const pendWeight = pendItems.reduce((s,r)=>s+(Number(r.bundleWeight)||0),0);
      const liberadasCount = items.length - pendItems.length;
      const liberadasWeight = items.filter(r=>r.passFail==='P').reduce((s,r)=>s+(Number(r.bundleWeight)||0),0);
      const isOpen = expandedSeq===seq;
      html += '<div class="ht-seq-card">';
      html += '<div class="ht-seq-head" onclick="htToggleSeq(\''+seq+'\')" style="cursor:pointer">';
      html += '<div class="ht-seq-left"><div><div class="ht-seq-num">'+esc(seq)+'</div>';
      html += '<div class="ht-seq-meta">'+items.length+' etiquetas · '+fmtNum(totalWeight,0)+' lb totales</div></div></div>';
      html += '<div class="ht-chevron" style="transform:rotate('+(isOpen?90:0)+'deg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>';
      html += '</div>';
      html += '<div class="ht-seq-stats">';
      html += '<div class="ht-seq-stat pend"><div class="ht-seq-stat-num">'+pendItems.length+'</div><div class="ht-seq-stat-lbl">Pendientes</div><div class="ht-seq-stat-sub">'+fmtNum(pendWeight,0)+' lb</div></div>';
      html += '<div class="ht-seq-stat rel"><div class="ht-seq-stat-num">'+liberadasCount+'</div><div class="ht-seq-stat-lbl">Liberadas</div><div class="ht-seq-stat-sub">'+fmtNum(liberadasWeight,0)+' lb</div></div>';
      html += '</div>';
      if(isOpen){
        html += '<div class="ht-seq-body">';
        pendItems.sort((a,b)=>String(a.rackNo).localeCompare(String(b.rackNo)));
        pendItems.forEach(r=>{ html += htTagCard(r); });
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  window.htToggleSeq = function(seq){
    expandedSeq = expandedSeq===seq ? null : seq;
    htRender();
  };

  // ---------- CONTADOR DE LIBRAS ----------
  function htRenderContador(){
    let html = '';
    html += '<div class="ht-card">';
    html += '<div class="ht-label">PESO BRUTO (LB)</div>';
    html += '<div class="ht-search-row">';
    html += '<input class="ht-input" id="ht-peso-input" type="number" inputmode="decimal" placeholder="Ej. 1000" onkeydown="if(event.key===\'Enter\'){htAddPeso();}" />';
    html += '<button class="ht-btn ht-btn-primary" onclick="htAddPeso()">Agregar</button>';
    html += '</div>';
    html += '<div class="ht-tara-row"><span>Tara aplicada: '+fmtNum(tara,0)+' lb</span><button onclick="htEditTara()">Cambiar</button></div>';
    html += '</div>';

    if(pesajes.length===0){
      html += '<div class="ht-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div>Agrega el peso bruto de cada rack<br/>y aquí verás el peso neto</div></div>';
      return html;
    }

    const totalBruto = pesajes.reduce((s,p)=>s+Number(p.bruto||0),0);
    const totalNeto = pesajes.reduce((s,p)=>s+(Number(p.bruto||0)-tara),0);

    html += '<div class="ht-stats">';
    html += '<div class="ht-stat"><div class="ht-stat-num">'+fmtNum(totalBruto,0)+'</div><div class="ht-stat-lbl">TOTAL BRUTO</div></div>';
    html += '<div class="ht-stat"><div class="ht-stat-num">'+fmtNum(totalNeto,0)+'</div><div class="ht-stat-lbl">TOTAL NETO</div></div>';
    html += '</div>';

    const list = pesajes.slice().reverse();
    list.forEach(p=>{
      const neto = Number(p.bruto||0) - tara;
      html += '<div class="ht-pes-row">';
      html += '<div class="ht-pes-left"><div class="ht-pes-neto">'+fmtNum(neto,0)+' lb neto</div><div class="ht-pes-bruto">Bruto: '+fmtNum(p.bruto,0)+' lb</div></div>';
      html += '<button class="ht-pes-del" onclick="htDeletePeso(\''+p.id+'\')" aria-label="Eliminar">&times;</button>';
      html += '</div>';
    });

    html += '<button class="ht-btn ht-btn-ghost ht-btn-block" style="margin-top:6px" onclick="htClearPesajes()">Limpiar todo</button>';

    return html;
  }

  window.htAddPeso = function(){
    const input = document.getElementById('ht-peso-input');
    const val = input ? input.value.trim() : '';
    if(val===''){ htToast('Escribe un peso.'); return; }
    const num = Number(val);
    if(isNaN(num)){ htToast('El peso debe ser un número.'); return; }
    pesajes.push({id:'p'+Date.now()+Math.floor(Math.random()*1000), bruto:num, createdAt:new Date().toISOString()});
    htSavePesajes();
    htRender();
    const freshInput = document.getElementById('ht-peso-input');
    if(freshInput) freshInput.focus();
  };

  window.htDeletePeso = function(id){
    pesajes = pesajes.filter(p=>p.id!==id);
    htSavePesajes();
    htRender();
  };

  window.htClearPesajes = function(){
    if(pesajes.length===0) return;
    if(!confirm('¿Borrar todos los pesajes registrados?')) return;
    pesajes = [];
    htSavePesajes();
    htRender();
  };

  window.htEditTara = function(){
    const val = prompt('Tara a descontar de cada peso (lb):', String(tara));
    if(val===null) return;
    const num = Number(val);
    if(isNaN(num) || val.trim()===''){ htToast('La tara debe ser un número.'); return; }
    tara = num;
    htSaveTara();
    htRender();
    htToast('Tara actualizada a '+fmtNum(tara,0)+' lb.');
  };

  // ---------- SINCRONIZAR ----------
  function htRenderSync(){
    let html = '';

    html += '<div class="ht-sync-box">';
    html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>';
    html += '<div class="ht-sync-title">Actualizar desde Excel</div>';
    html += '<div class="ht-sync-desc">Selecciona el archivo "etiquetas - buscador de hornos.xlsx" más reciente. Se leerá la hoja Bundle Tags: bundles nuevos, cambios de Pass/Fail y demás datos se actualizan en el teléfono desde aquí. Esta es la única forma de capturar información en la app.</div>';
    html += '<button class="ht-btn ht-btn-primary ht-btn-block" onclick="document.getElementById(\'ht-file-input\').click()" '+(syncBusy?'disabled':'')+'>'+(syncBusy?'Leyendo archivo…':'Elegir archivo Excel')+'</button>';
    html += '</div>';

    html += '<div class="ht-card" style="margin-top:12px">';
    html += '<div class="ht-sync-title" style="margin-bottom:2px">Exportar a Excel</div>';
    html += '<div class="ht-sync-desc" style="margin-bottom:10px">Genera un archivo Excel con la hoja Bundle Tags tal como está en el teléfono, útil como respaldo o para revisarla en la computadora.</div>';
    html += '<button class="ht-btn ht-btn-ghost ht-btn-block" onclick="htExportExcel()">Exportar Bundle Tags</button>';
    html += '</div>';

    html += '<div class="ht-card">';
    html += '<div class="ht-meta-row"><span>Última actualización desde Excel</span><b>'+fmtDateTime(lastImport)+'</b></div>';
    html += '<div class="ht-meta-row"><span>Último archivo exportado</span><b>'+fmtDateTime(lastExport)+'</b></div>';
    html += '<div class="ht-meta-row"><span>Bundles en el teléfono</span><b>'+records.length+'</b></div>';
    html += '</div>';

    return html;
  }

  window.htHandleFile = async function(ev){
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if(!file) return;
    if(typeof XLSX === 'undefined'){
      htToast('No se pudo cargar el lector de Excel. Revisa tu conexión.');
      return;
    }
    syncBusy = true;
    htRender();
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames.find(n=>n.trim().toLowerCase()==='bundle tags') || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});
      if(!aoa.length){ htToast('El archivo no tiene datos.'); syncBusy=false; htRender(); return; }

      const fileHeaders = (aoa[0]||[]).map(h=>String(h||'').trim()).filter(h=>h);
      let added = 0, updated = 0, unchanged = 0;

      for(let i=1; i<aoa.length; i++){
        const row = aoa[i];
        if(!row || row.every(v=>v==='' || v===undefined || v===null)) continue;
        const rowObj = {};
        fileHeaders.forEach((h, idx)=>{ rowObj[h] = row[idx]; });
        if(!rowObj['Tag Number']) continue;

        const imported = { extra:{} };
        fileHeaders.forEach(h=>{
          let v = rowObj[h];
          if(v instanceof Date) v = v.toISOString().slice(0,10);
          const key = MANAGED_HEADERS[h];
          if(key){
            if(key==='press' && typeof v === 'string') v = v.trim();
            if(key==='branch' && typeof v === 'string') v = v.trim();
            if(key==='passFail') v = v ? String(v).trim().toUpperCase() : '';
            if(key==='bundleWeight') v = Number(v) || 0;
            imported[key] = v===undefined||v===null ? '' : v;
          } else {
            imported.extra[h] = v===undefined||v===null ? '' : v;
          }
        });

        const existing = records.find(r=>String(r.tagNumber)===String(imported.tagNumber));
        if(existing){
          const before = JSON.stringify(existing);
          Object.keys(MANAGED_HEADERS).forEach(h=>{
            const key = MANAGED_HEADERS[h];
            if(key==='passFail') return;
            if(imported[key]!==undefined) existing[key] = imported[key];
          });
          if(imported.passFail){ existing.passFail = imported.passFail; }
          existing.extra = Object.assign({}, existing.extra||{}, imported.extra);
          if(JSON.stringify(existing)!==before) updated++; else unchanged++;
        } else {
          records.push(Object.assign({id:'excel-'+imported.tagNumber, createdAt:new Date().toISOString()}, imported));
          added++;
        }
      }

      headers = fileHeaders;
      lastImport = new Date().toISOString();
      await htSaveRecords();
      await htSaveMeta();
      htToast(added+' nuevos · '+updated+' actualizados · '+unchanged+' sin cambios');
    }catch(err){
      console.error(err);
      htToast('No se pudo leer el archivo. Verifica que sea el Excel correcto.');
    }
    syncBusy = false;
    htRender();
  };

  window.htExportExcel = function(){
    if(typeof XLSX === 'undefined'){
      htToast('No se pudo cargar el generador de Excel.');
      return;
    }
    const outHeaders = headers && headers.length ? headers : Object.keys(MANAGED_HEADERS);
    const rows = [outHeaders];
    records.forEach(r=>{
      rows.push(outHeaders.map(h=>{
        const key = MANAGED_HEADERS[h];
        if(key) return r[key]===undefined||r[key]===null ? '' : r[key];
        return (r.extra && r.extra[h]!==undefined) ? r.extra[h] : '';
      }));
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wbOut = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbOut, ws, 'Bundle Tags');
    const wbBin = XLSX.write(wbOut, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbBin], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = 'Bundle Tags - '+stamp+'.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    lastExport = new Date().toISOString();
    htSaveMeta();
    htToast('Archivo exportado');
    htRender();
  };

  htLoad();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
</script>
